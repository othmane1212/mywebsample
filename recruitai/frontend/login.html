<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in, RecruitAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230F1A2B%27/%3E%3Ccircle cx=%2750%27 cy=%2742%27 r=%2716%27 fill=%27none%27 stroke=%27%23E0933C%27 stroke-width=%278%27/%3E%3Cpath d=%27M50 58 L50 76%27 stroke=%27%23E0933C%27 stroke-width=%278%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="hero-bg auth-page">
<div class="topbar">
  <a href="index.html" class="brand">RecruitAI<span class="dot">.</span></a>
  <div class="nav-links">
    <a href="register.html" data-i18n="nav.createAccount">Create account</a>
  </div>
</div>

<div class="auth-stage">
  <div class="auth-wrap auth-card">
    <h1 data-i18n="auth.welcomeBack">Welcome back</h1>
    <div class="sub" data-i18n="auth.loginSub">Log in to your RecruitAI account.</div>

    <form id="login-form">
      <div class="field">
        <label data-i18n="auth.email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label data-i18n="auth.password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" data-i18n="nav.login">Log in</button>
      <div id="msg" class="form-msg"></div>
    </form>

    <div class="switch-line"><span data-i18n="auth.newHere">New here?</span> <a href="register.html" data-i18n="nav.createAccount">Create an account</a></div>
  </div>
</div>
</div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    try {
      const user = await Api.post("/api/login", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      Session.save(user);
      window.location.href = user.role === "recruiter" ? "dashboard.html" : (user.role === "admin" ? "admin.html" : "candidate.html");
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error";
    }
  });
</script>

</body>
</html>
