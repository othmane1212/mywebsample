<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin, RecruitAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230F1A2B%27/%3E%3Ccircle cx=%2750%27 cy=%2742%27 r=%2716%27 fill=%27none%27 stroke=%27%23E0933C%27 stroke-width=%278%27/%3E%3Cpath d=%27M50 58 L50 76%27 stroke=%27%23E0933C%27 stroke-width=%278%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="sidebar">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <a href="index.html" class="brand">RecruitAI<span class="dot">.</span></a>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">
        <svg class="icon" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div class="icon-row">
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 3.5 1 5 1.6 6H4.4C5 13 6 11.5 6 8Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
        <span class="icon-badge" id="notif-badge" style="display:none;">0</span>
      </button>
      <div class="notif-dropdown" id="notif-dropdown"></div>
      <a href="settings.html" class="icon-btn" title="Settings">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </a>
      <button class="icon-btn" id="help-btn" title="Help">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 1.8-2.3 3.3"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <div class="who" data-i18n="common.signedInAs">Signed in as</div>
    <strong id="who-name">—</strong>
    <a class="side-link active" data-view="overview" data-i18n="admin.overview">Overview</a>
    <a class="side-link" data-view="jobs" data-i18n="admin.allJobs">All jobs</a>
    <a class="side-link" data-view="users" data-i18n="admin.allUsers">All users</a>
    <a class="side-link logout" id="logout" data-i18n="common.logout">Log out</a>
  </div>

  <div class="main">

    <div id="view-overview">
      <h1 data-i18n="admin.overview">Platform overview</h1>
      <div class="sub" data-i18n="admin.overviewSub">Global visibility across every recruiter and candidate on RecruitAI.</div>
      <div class="stats-row" style="justify-content:flex-start; gap:16px; margin-bottom:8px; flex-wrap:wrap;" id="stats-row"></div>
    </div>

    <div id="view-jobs" style="display:none;">
      <h1 data-i18n="admin.allJobs">All jobs</h1>
      <div class="sub" data-i18n="admin.allJobsSub">Every job posted on the platform, across every recruiter.</div>
      <div id="jobs-table"></div>
    </div>

    <div id="view-users" style="display:none;">
      <h1 data-i18n="admin.allUsers">All users</h1>
      <div class="sub" data-i18n="admin.allUsersSub">Every recruiter and candidate account on RecruitAI.</div>
      <div id="users-table"></div>
    </div>

  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
const user = Session.requireRole("admin");
if (user) {
  document.getElementById("who-name").textContent = user.full_name;
  initNotifications(user.id);
  initHelpModal("admin");
}
document.getElementById("logout").onclick = () => { Session.clear(); window.location.href = "index.html"; };

document.querySelectorAll(".side-link[data-view]").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll(".side-link[data-view]").forEach(l => l.classList.remove("active"));
    link.classList.add("active");
    ["overview", "jobs", "users"].forEach(v => {
      document.getElementById("view-" + v).style.display = v === link.dataset.view ? "block" : "none";
    });
  });
});

async function loadOverview() {
  const data = await Api.get("/api/admin/overview");

  document.getElementById("stats-row").innerHTML = `
    <div class="admin-stat-card">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <div class="stat-num">${data.stats.total_recruiters}</div><div class="stat-label">Recruiters</div>
    </div>
    <div class="admin-stat-card">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div class="stat-num">${data.stats.total_candidates}</div><div class="stat-label">Candidates</div>
    </div>
    <div class="admin-stat-card">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <div class="stat-num">${data.stats.open_jobs}</div><div class="stat-label">Open jobs</div>
    </div>
    <div class="admin-stat-card">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h8l6 6v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5a1 1 0 0 0 1 1h5"/></svg>
      <div class="stat-num">${data.stats.total_applications}</div><div class="stat-label">Applications</div>
    </div>
  `;

  document.getElementById("jobs-table").innerHTML = data.jobs.length === 0
    ? `<div class="empty-state panel"><h3>No jobs yet</h3></div>`
    : data.jobs.map(j => `
      <div class="job-card">
        <div>
          <h3>${j.title}</h3>
          <div class="meta">${j.company_name || j.recruiter_name} · ${j.application_count} applicant${j.application_count === 1 ? "" : "s"}</div>
          <span class="status-pill">${j.status}</span>
        </div>
        <button class="btn btn-small" onclick="removeJob(${j.id})">Remove</button>
      </div>
    `).join("");

  document.getElementById("users-table").innerHTML = data.users.length === 0
    ? `<div class="empty-state panel"><h3>No users yet</h3></div>`
    : data.users.map(u => `
      <div class="job-card">
        <div>
          <h3>${u.full_name}</h3>
          <div class="meta">${u.email} · ${u.role}${u.company_name ? " · " + u.company_name : ""}</div>
        </div>
        ${u.role !== "admin" ? `<button class="btn btn-small" onclick="removeUser(${u.id})">Remove</button>` : ""}
      </div>
    `).join("");
}

async function removeJob(jobId) {
  if (!confirm("Remove this job posting? This cannot be undone.")) return;
  await fetch(`/api/admin/jobs/${jobId}`, { method: "DELETE" });
  loadOverview();
}

async function removeUser(userId) {
  if (!confirm("Remove this user account? This cannot be undone.")) return;
  await fetch(`/api/admin/users/${userId}`, { method: "DELETE" });
  loadOverview();
}

if (user) loadOverview();
</script>

</body>
</html>
